<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" href="connexion.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-container">
    <div class="login-card">
        <!--RETOUR-->
        <a href="index.html" class="back"> ←</a>
        <img src="logoregi.jpg" alt="Logo REGIDESO" class="brand-logo">
        <!--TITRE-->
        <h1>Connexion</h1>
        
        <!--FORMULAIRE-->
         <div class="input-box">
            <span><i class="fa-solid fa-id-card"></i></span>
            <input type="text" placeholder="Numéro client">
         </div>  
         
         <div class="input-box password-box">
            <span><i class="fa-solid fa-lock"></i></span>
            <div class="password-field">
                <input id="loginPassword" type="password" placeholder="Mot de passe">
                <button type="button" class="toggle-password" aria-label="Afficher le mot de passe">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
         </div>

         <button class="login-btn" type="button">
                Se connecter
         </button>
         <p class="bottom-text">
            Pas encore de compte ? 
         <a href="connexion2.html">Créer un compte</a>
         </p>
      </div>
    <script>
        document.querySelectorAll('.toggle-password').forEach(function (button) {
            button.addEventListener('click', function () {
                const input = button.parentElement.querySelector('input');
                if (!input) return;

                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';

                const icon = button.querySelector('i');
                if (icon) {
                    icon.classList.toggle('fa-eye', !isPassword);
                    icon.classList.toggle('fa-eye-slash', isPassword);
                }
            });
        });
    </script>
</body>
</html>
