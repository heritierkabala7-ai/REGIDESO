<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement</title>
    <link rel="stylesheet" href="Paiement.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
   <div class="paiement-page">
        <div class="paiement-header">
            <a href="index.html" class="retour">←</a>
            
            <p>Moyen de paiement</p>
        </div>
        <form class="moyens-paiement" id="paymentForm">
            <label class="moyen">
                <div class="info-reseau">
                    <img width="100" src="mpesa.png" alt="M-Pesa">
                    <strong class="mpesa">M-Pesa</strong>
                </div>
                <input type="radio" name="paiement" value="M-Pesa">
            </label>

            <label class="moyen">
                <div class="info-reseau">
                    <img width="100" height="100" src="airtelmoney.jpg" alt="Airtel Money">
                    <strong class="airtel">Airtel Money</strong>
                </div>
                <input type="radio" name="paiement" value="Airtel Money">
            </label>

            <label class="moyen">
                <div class="info-reseau">
                    <img width="100" height="100" src="orangemoney.png" alt="Orange Money">
                    <strong class="orange">Orange Money</strong>
                </div>
                <input type="radio" name="paiement" value="Orange Money">
            </label>

            <label class="moyen">
                <div class="info-reseau">
                    <img width="100px" src="affrimoney.jpg" alt="Affrimoney">
                    <strong class="affrimoney">Affrimoney</strong>
                </div>
                <input type="radio" name="paiement" value="Affrimoney">
            </label>

            <button class="btn-suivant" type="submit">Confirmer le paiement</button>
        </form>

        <script>
            const paymentForm = document.getElementById('paymentForm');
            const serviceInputs = document.querySelectorAll('input[name="paiement"]');

            paymentForm.addEventListener('submit', function (event) {
                event.preventDefault();

                const chosenService = document.querySelector('input[name="paiement"]:checked');

                if (!chosenService) {
                    alert('Veuillez choisir un moyen de paiement.');
                    return;
                }

                const serviceValue = encodeURIComponent(chosenService.value);
                window.location.href = 'souscription.html?service=' + serviceValue;
            });
        </script>

   </div>
</body>
</html>
